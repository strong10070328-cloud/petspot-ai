<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- 摄像头主体（圆角方形 → 现代智能硬件感） -->
  <rect x="28" y="20" width="72" height="72" rx="20" fill="none" stroke="#EA580C" stroke-width="5"/>
  
  <!-- 镜头外圈 -->
  <circle cx="64" cy="56" r="24" fill="none" stroke="#EA580C" stroke-width="3.5"/>
  
  <!-- 镜头内圈 -->
  <circle cx="64" cy="56" r="10" fill="#EA580C"/>
  
  <!-- 镜头高光 -->
  <circle cx="58" cy="50" r="3" fill="#FFFFFF" opacity="0.5"/>
  
  <!-- 食物掉落轨迹（零食颗粒 + 下落弧线） -->
  <!-- 零食本体 -->
  <circle cx="64" cy="96" r="6" fill="#EA580C"/>
  
  <!-- 下落路径（虚线弧线） -->
  <path d="M64 80 Q70 88 64 96" fill="none" stroke="#EA580C" stroke-width="2.5" stroke-dasharray="3 3" opacity="0.7"/>
</svg>